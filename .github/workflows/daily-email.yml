name: Daily Email

on:
  schedule:
    - cron: '0 6 * * *'

  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send email
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python3 <<'PY'
          import base64
          import mimetypes
          import os
          import smtplib
          from email.message import EmailMessage
          from email.utils import formataddr
          from pathlib import Path

          # ============================================================
          # CONFIGURAÇÃO
          # ============================================================

          username = os.environ["EMAIL_USERNAME"]
          password = os.environ["EMAIL_PASSWORD"]

          # ============================================================
          # LÊ O STATE.TXT
          # ============================================================

          state_file = Path("state.txt")

          lines = state_file.read_text(
              encoding="utf-8"
          ).splitlines()

          if not lines:
              raise RuntimeError("state.txt está vazio.")

          image_path = lines[0].strip()

          if not image_path:
              raise RuntimeError(
                  "A primeira linha do state.txt está vazia."
              )

          print(f"Imagem indicada pelo state.txt:")
          print(image_path)

          # ============================================================
          # DESCOBRE O NOME DO ARQUIVO
          #
          # photos/final_fantasy_07_remake_intergrade_01.jpg
          #
          # vira:
          #
          # final_fantasy_07_remake_intergrade_01
          # ============================================================

          image_filename = Path(image_path).name
          image_stem = Path(image_filename).stem

          # ============================================================
          # LOCALIZA O TXT BASE64
          #
          # photos_base64/
          # final_fantasy_07_remake_intergrade_01.txt
          # ============================================================

          base64_file = (
              Path("photos_base64") /
              f"{image_stem}.txt"
          )

          print(f"Arquivo Base64:")
          print(base64_file)

          if not base64_file.exists():
              raise RuntimeError(
                  f"Arquivo Base64 não encontrado: {base64_file}"
              )

          # ============================================================
          # LÊ O BASE64
          # ============================================================

          encoded = base64_file.read_text(
              encoding="utf-8"
          )

          # Remove espaços e quebras de linha
          encoded = "".join(encoded.split())

          # Caso o TXT já contenha:
          # data:image/jpeg;base64,...
          if encoded.startswith("data:"):
              encoded = encoded.split(",", 1)[1]

          try:
              image_data = base64.b64decode(
                  encoded,
                  validate=True
              )
          except Exception as error:
              raise RuntimeError(
                  f"Base64 inválido em {base64_file}: {error}"
              )

          # ============================================================
          # DESCOBRE O MIME TYPE
          # ============================================================

          mime_type, _ = mimetypes.guess_type(
              image_filename
          )

          if not mime_type or not mime_type.startswith("image/"):
              raise RuntimeError(
                  f"Não foi possível identificar o tipo da imagem: "
                  f"{image_filename}"
              )

          maintype, subtype = mime_type.split("/", 1)

          print(f"Nome da imagem: {image_filename}")
          print(f"MIME type: {mime_type}")
          print(f"Tamanho: {len(image_data)} bytes")

          # ============================================================
          # LÊ O TEMPLATE HTML
          # ============================================================

          template_file = Path(
              "templates/daily-report.html"
          )

          html = template_file.read_text(
              encoding="utf-8"
          )

          # ============================================================
          # CRIA O E-MAIL
          # ============================================================

          message = EmailMessage()

          message["Subject"] = "IMAGEM DO DIA"
          message["From"] = formataddr(
              ("GitHub Actions", username)
          )
          message["To"] = username

          message.set_content(
              "Seu cliente de e-mail não suporta HTML."
          )

          message.add_alternative(
              html,
              subtype="html"
          )

          # ============================================================
          # ADICIONA A IMAGEM INLINE
          #
          # O HTML usa:
          #
          # cid:imagem-do-dia
          #
          # ============================================================

          html_part = message.get_payload()[1]

          html_part.add_related(
              image_data,
              maintype=maintype,
              subtype=subtype,
              cid="<imagem-do-dia>",
              filename=image_filename
          )

          # ============================================================
          # ENVIA PELO GMAIL SMTP
          # ============================================================

          print("Conectando ao Gmail SMTP...")

          with smtplib.SMTP_SSL(
              "smtp.gmail.com",
              465
          ) as smtp:

              smtp.login(
                  username,
                  password
              )

              smtp.send_message(
                  message
              )

          print("E-mail enviado com sucesso!")
          PY
